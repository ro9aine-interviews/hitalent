services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hitalent
      POSTGRES_USER: hitalent
      POSTGRES_PASSWORD: hitalent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitalent -d hitalent"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://hitalent:hitalent@db:5432/hitalent

volumes:
  postgres-data:
