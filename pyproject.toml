[project]
name = "hitalent"
version = "0.1.0"
description = "Test task for Python Developer Hitalent"
authors = [
    {name = "ro9aine"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "httpx (>=0.28.0,<0.29.0)"
]

[project.scripts]
tests = "tests.runner:main"

[tool.poetry]
packages = [
    {include = "src"},
    {include = "tests"}
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
